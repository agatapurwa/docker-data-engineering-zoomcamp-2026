id: 10_chat_without_rag
namespace: zoomcamp
description: |
  Baseline LLM completion WITHOUT Retrieval Augmented Generation (RAG).
  Demonstrates how an ungrounded model guesses or hallucinates release details.

inputs:
  - id: question
    type: STRING
    displayName: Question to ask the ungrounded LLM
    defaults: "Which features were released in Kestra 1.1? Please list at least 5 major features with brief descriptions."

tasks:
  - id: chat_without_rag
    type: io.kestra.plugin.ai.completion.ChatCompletion
    description: Query Gemini without external document context
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-3.5-flash-lite
      apiKey: "{{ kv('GEMINI_API_KEY') }}"
    messages:
      - type: SYSTEM
        content: You are a helpful assistant that answers questions about Kestra.
      - type: USER
        content: "{{ inputs.question }}"

  - id: log_results
    type: io.kestra.plugin.core.log.Log
    message: |
      ⚠️ Ungrounded Response (NO RAG context):
      {{ outputs.chat_without_rag.textOutput }}