id: 08_local_taxi
namespace: zoomcamp
description: |
  Local ELT simulation of 08_gcp_taxi using RustFS (S3 Data Lake) and PostgreSQL 16 (Data Warehouse).
  Data source: https://github.com/DataTalksClub/nyc-tlc-data/releases

inputs:
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: green

  - id: year
    type: SELECT
    displayName: Select year
    values: ["2019", "2020"]
    defaults: "2019"
    allowCustomValue: true

  - id: month
    type: SELECT
    displayName: Select month
    values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    defaults: "01"

variables:
  file: "{{inputs.taxi}}_tripdata_{{inputs.year}}-{{inputs.month}}.csv"
  table: "{{kv('WAREHOUSE_DATASET')}}.{{inputs.taxi}}_tripdata_{{inputs.year}}_{{inputs.month}}"
  data: "{{outputs.extract.outputFiles[inputs.taxi ~ '_tripdata_' ~ inputs.year ~ '-' ~ inputs.month ~ '.csv']}}"

tasks:
  - id: set_label
    type: io.kestra.plugin.core.execution.Labels
    labels:
      file: "{{render(vars.file)}}"
      taxi: "{{inputs.taxi}}"

  # 1. EXTRACT: Stream compressed CSV from GitHub into Kestra internal storage
  - id: extract
    type: io.kestra.plugin.scripts.shell.Commands
    outputFiles:
      - "*.csv"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - wget -qO- https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{inputs.taxi}}/{{render(vars.file)}}.gz | gunzip > {{render(vars.file)}}

  # 2. LOAD (Data Lake): Upload raw CSV to RustFS bucket (simulates upload_to_gcs)
  - id: upload_to_datalake
    type: io.kestra.plugin.aws.s3.Upload
    from: "{{render(vars.data)}}"
    key: "{{render(vars.file)}}"

  # 3. READ FROM DATA LAKE: Fetch object from S3 bucket to feed warehouse external staging
  - id: read_from_datalake
    type: io.kestra.plugin.aws.s3.Download
    key: "{{render(vars.file)}}"

  # 4A. TRANSFORM & MERGE (Yellow Taxi Branch)
  - id: if_yellow_taxi
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi == 'yellow'}}"
    then:
      - id: dw_yellow_tripdata
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          CREATE TABLE IF NOT EXISTS {{kv('WAREHOUSE_DATASET')}}.yellow_tripdata (
              unique_row_id TEXT,
              filename TEXT,
              VendorID TEXT,
              tpep_pickup_datetime TIMESTAMP,
              tpep_dropoff_datetime TIMESTAMP,
              passenger_count INTEGER,
              trip_distance NUMERIC,
              RatecodeID TEXT,
              store_and_fwd_flag TEXT,
              PULocationID TEXT,
              DOLocationID TEXT,
              payment_type INTEGER,
              fare_amount NUMERIC,
              extra NUMERIC,
              mta_tax NUMERIC,
              tip_amount NUMERIC,
              tolls_amount NUMERIC,
              improvement_surcharge NUMERIC,
              total_amount NUMERIC,
              congestion_surcharge NUMERIC
          );
          CREATE INDEX IF NOT EXISTS idx_yellow_unique_row_id ON {{kv('WAREHOUSE_DATASET')}}.yellow_tripdata (unique_row_id);
          CREATE INDEX IF NOT EXISTS idx_yellow_pickup_date ON {{kv('WAREHOUSE_DATASET')}}.yellow_tripdata (tpep_pickup_datetime);

          DROP TABLE IF EXISTS {{render(vars.table)}}_ext;
          CREATE TABLE {{render(vars.table)}}_ext (
              VendorID TEXT,
              tpep_pickup_datetime TIMESTAMP,
              tpep_dropoff_datetime TIMESTAMP,
              passenger_count INTEGER,
              trip_distance NUMERIC,
              RatecodeID TEXT,
              store_and_fwd_flag TEXT,
              PULocationID TEXT,
              DOLocationID TEXT,
              payment_type INTEGER,
              fare_amount NUMERIC,
              extra NUMERIC,
              mta_tax NUMERIC,
              tip_amount NUMERIC,
              tolls_amount NUMERIC,
              improvement_surcharge NUMERIC,
              total_amount NUMERIC,
              congestion_surcharge NUMERIC
          );

      - id: dw_yellow_copy_ext
        type: io.kestra.plugin.jdbc.postgresql.CopyIn
        format: CSV
        header: true
        from: "{{outputs.read_from_datalake.uri}}"
        table: "{{render(vars.table)}}_ext"

      - id: dw_yellow_transform_and_merge
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          DROP TABLE IF EXISTS {{render(vars.table)}};
          CREATE TABLE {{render(vars.table)}} AS
          SELECT
            md5(concat(
              coalesce(cast(VendorID as text), ''),
              coalesce(cast(tpep_pickup_datetime as text), ''),
              coalesce(cast(tpep_dropoff_datetime as text), ''),
              coalesce(cast(PULocationID as text), ''),
              coalesce(cast(DOLocationID as text), '')
            )) AS unique_row_id,
            '{{render(vars.file)}}'::text AS filename,
            *
          FROM {{render(vars.table)}}_ext;

          MERGE INTO {{kv('WAREHOUSE_DATASET')}}.yellow_tripdata T
          USING {{render(vars.table)}} S
          ON T.unique_row_id = S.unique_row_id
          WHEN NOT MATCHED THEN
            INSERT (unique_row_id, filename, VendorID, tpep_pickup_datetime, tpep_dropoff_datetime, passenger_count, trip_distance, RatecodeID, store_and_fwd_flag, PULocationID, DOLocationID, payment_type, fare_amount, extra, mta_tax, tip_amount, tolls_amount, improvement_surcharge, total_amount, congestion_surcharge)
            VALUES (S.unique_row_id, S.filename, S.VendorID, S.tpep_pickup_datetime, S.tpep_dropoff_datetime, S.passenger_count, S.trip_distance, S.RatecodeID, S.store_and_fwd_flag, S.PULocationID, S.DOLocationID, S.payment_type, S.fare_amount, S.extra, S.mta_tax, S.tip_amount, S.tolls_amount, S.improvement_surcharge, S.total_amount, S.congestion_surcharge);

  # 4B. TRANSFORM & MERGE (Green Taxi Branch)
  - id: if_green_taxi
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi == 'green'}}"
    then:
      - id: dw_green_tripdata
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          CREATE TABLE IF NOT EXISTS {{kv('WAREHOUSE_DATASET')}}.green_tripdata (
              unique_row_id TEXT,
              filename TEXT,
              VendorID TEXT,
              lpep_pickup_datetime TIMESTAMP,
              lpep_dropoff_datetime TIMESTAMP,
              store_and_fwd_flag TEXT,
              RatecodeID TEXT,
              PULocationID TEXT,
              DOLocationID TEXT,
              passenger_count INTEGER,
              trip_distance NUMERIC,
              fare_amount NUMERIC,
              extra NUMERIC,
              mta_tax NUMERIC,
              tip_amount NUMERIC,
              tolls_amount NUMERIC,
              ehail_fee NUMERIC,
              improvement_surcharge NUMERIC,
              total_amount NUMERIC,
              payment_type INTEGER,
              trip_type TEXT,
              congestion_surcharge NUMERIC
          );
          CREATE INDEX IF NOT EXISTS idx_green_unique_row_id ON {{kv('WAREHOUSE_DATASET')}}.green_tripdata (unique_row_id);
          CREATE INDEX IF NOT EXISTS idx_green_pickup_date ON {{kv('WAREHOUSE_DATASET')}}.green_tripdata (lpep_pickup_datetime);

          DROP TABLE IF EXISTS {{render(vars.table)}}_ext;
          CREATE TABLE {{render(vars.table)}}_ext (
              VendorID TEXT,
              lpep_pickup_datetime TIMESTAMP,
              lpep_dropoff_datetime TIMESTAMP,
              store_and_fwd_flag TEXT,
              RatecodeID TEXT,
              PULocationID TEXT,
              DOLocationID TEXT,
              passenger_count INTEGER,
              trip_distance NUMERIC,
              fare_amount NUMERIC,
              extra NUMERIC,
              mta_tax NUMERIC,
              tip_amount NUMERIC,
              tolls_amount NUMERIC,
              ehail_fee NUMERIC,
              improvement_surcharge NUMERIC,
              total_amount NUMERIC,
              payment_type INTEGER,
              trip_type TEXT,
              congestion_surcharge NUMERIC
          );

      - id: dw_green_copy_ext
        type: io.kestra.plugin.jdbc.postgresql.CopyIn
        format: CSV
        header: true
        from: "{{outputs.read_from_datalake.uri}}"
        table: "{{render(vars.table)}}_ext"

      - id: dw_green_transform_and_merge
        type: io.kestra.plugin.jdbc.postgresql.Queries
        sql: |
          DROP TABLE IF EXISTS {{render(vars.table)}};
          CREATE TABLE {{render(vars.table)}} AS
          SELECT
            md5(concat(
              coalesce(cast(VendorID as text), ''),
              coalesce(cast(lpep_pickup_datetime as text), ''),
              coalesce(cast(lpep_dropoff_datetime as text), ''),
              coalesce(cast(PULocationID as text), ''),
              coalesce(cast(DOLocationID as text), '')
            )) AS unique_row_id,
            '{{render(vars.file)}}'::text AS filename,
            *
          FROM {{render(vars.table)}}_ext;

          MERGE INTO {{kv('WAREHOUSE_DATASET')}}.green_tripdata T
          USING {{render(vars.table)}} S
          ON T.unique_row_id = S.unique_row_id
          WHEN NOT MATCHED THEN
            INSERT (unique_row_id, filename, VendorID, lpep_pickup_datetime, lpep_dropoff_datetime, store_and_fwd_flag, RatecodeID, PULocationID, DOLocationID, passenger_count, trip_distance, fare_amount, extra, mta_tax, tip_amount, tolls_amount, ehail_fee, improvement_surcharge, total_amount, payment_type, trip_type, congestion_surcharge)
            VALUES (S.unique_row_id, S.filename, S.VendorID, S.lpep_pickup_datetime, S.lpep_dropoff_datetime, S.store_and_fwd_flag, S.RatecodeID, S.PULocationID, S.DOLocationID, S.passenger_count, S.trip_distance, S.fare_amount, S.extra, S.mta_tax, S.tip_amount, S.tolls_amount, S.ehail_fee, S.improvement_surcharge, S.total_amount, S.payment_type, S.trip_type, S.congestion_surcharge);

  # 5. CLEANUP: Purge temporary CSV files from Kestra worker storage
  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: Deletes temporary execution files from Kestra internal storage.
    disabled: false

pluginDefaults:
  - type: io.kestra.plugin.aws.s3
    values:
      bucket: "{{kv('LAKE_BUCKET_NAME')}}"
      endpointOverride: "{{kv('S3_ENDPOINT')}}"
      region: "{{kv('S3_REGION')}}"
      accessKeyId: "{{secret('MINIO_ACCESS_KEY')}}"
      secretKeyId: "{{secret('MINIO_SECRET_KEY')}}"
      compatibilityMode: true
      forcePathStyle: true

  - type: io.kestra.plugin.jdbc.postgresql
    values:
      url: jdbc:postgresql://pgdatabase:5432/ny_taxi
      username: root
      password: root