id: 11_chat_with_rag
namespace: zoomcamp
description: |
  RAG-grounded workflow that ingests Kestra 1.1 release notes into KestraKVStore
  and answers questions strictly from retrieved vector chunks.

inputs:
  - id: ingest_docs
    type: BOOLEAN
    displayName: Re-ingest and re-embed documentation into KV Store?
    defaults: true

  - id: doc_url
    type: STRING
    displayName: Source Markdown URL to index
    defaults: "https://raw.githubusercontent.com/kestra-io/docs/refs/heads/main/src/contents/blogs/release-1-1/index.md"

  - id: question
    type: STRING
    displayName: Question to ask the RAG agent
    defaults: "Which features were released in Kestra 1.1? Please list at least 5 major features with brief descriptions."

tasks:
  - id: maybe_ingest
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.ingest_docs }}"
    then:
      - id: ingest_release_notes
        type: io.kestra.plugin.ai.rag.IngestDocument
        description: Chunk and embed Kestra 1.1 release notes into KestraKVStore
        provider:
          type: io.kestra.plugin.ai.provider.GoogleGemini
          modelName: gemini-embedding-001
          apiKey: "{{ kv('GEMINI_API_KEY') }}"
        embeddings:
          type: io.kestra.plugin.ai.embeddings.KestraKVStore
        drop: true
        fromExternalURLs:
          - "{{ inputs.doc_url }}"

  - id: chat_with_rag
    type: io.kestra.plugin.ai.rag.ChatCompletion
    description: Query Kestra documentation using vector similarity retrieval
    chatProvider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-3.5-flash-lite
      apiKey: "{{ kv('GEMINI_API_KEY') }}"
    embeddingProvider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-embedding-001
      apiKey: "{{ kv('GEMINI_API_KEY') }}"
    embeddings:
      type: io.kestra.plugin.ai.embeddings.KestraKVStore
    systemMessage: |
      You are a helpful assistant that answers questions about Kestra.
      Use ONLY the provided documentation context to give accurate, specific answers.
      If the answer is not present in the retrieved context, explicitly state that you do not know.
    prompt: "{{ inputs.question }}"

  - id: log_results
    type: io.kestra.plugin.core.log.Log
    message: |
      ✅ RAG Response (with retrieved context):
      {{ outputs.chat_with_rag.textOutput }}